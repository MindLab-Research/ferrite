[workspace]
resolver = "2"
members = [
    "crates/ferrite-types",
    "crates/ferrite-model",
    "crates/ferrite-kernel",
    "crates/ferrite-kv",
    "crates/ferrite-batch",
    "crates/ferrite-scheduler",
    "crates/ferrite-exec",
    "crates/ferrite-serve",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[profile.release]
lto = "thin"
codegen-units = 1
