[package]
name = "ferrite-dsv41"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeepSeek-V4.1-Flash support: config, fp4/fp8-MX/ue8m0 quant primitives, engram n-gram hashing, engine ops and the model chain."

[dependencies]
thiserror.workspace = true
# dlopen for libcudart / libcublas / libferrite_kernels.so. Deliberately NOT a
# link-time dependency: the crate keeps building and unit-testing on a box with
# no CUDA (the CPU golden path), and the GPU path resolves its symbols at
# runtime exactly like ferrite-kernel does.
libc = "0.2"
# the checkpoint ships tokenizer.json; same crate/version as ferrite-serve
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
serde.workspace = true
serde_json.workspace = true
ferrite-types = { path = "../ferrite-types" }
# The model definition itself: config, quant primitives, engram tables,
# reference ops, the layer chain and the weight layout. This crate re-exports
# it as a shim so existing consumers (src/bin + tests) keep their module paths.
ferrite-models = { path = "../ferrite-models" }
# The SHARED runtime device layer (stream, byte-granular allocation, H2D/D2H/
# D2D copies, peer access, CUDA-graph capture, cuBLAS GEMMs). Deliberately
# WITHOUT the `cuda` feature: `devrt` resolves every symbol through dlopen at
# first use, so this crate still builds and unit-tests on a box with no CUDA.
ferrite-kernel = { path = "../ferrite-kernel" }
# The shared HTTP/SSE serving stack (axum routes, the engine driver thread, the
# chat-tokenizer/stop-set boundary, the single-flight engine adapter). The
# DSV41 serve mode uses the SAME code GLM serves through — no std::net server,
# no forked HTTP layer here.
ferrite-http = { path = "../ferrite-http" }
