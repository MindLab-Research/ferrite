[package]
name = "ferrite-serve"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ferrite-serve"
path = "src/main.rs"

[features]
default = ["cuda"]
cuda = ["ferrite-kernel/cuda", "ferrite-exec/cuda"]

[dependencies]
thiserror.workspace = true
serde_json.workspace = true
rayon.workspace = true
ferrite-types = { path = "../ferrite-types" }
ferrite-model = { path = "../ferrite-model" }
ferrite-kernel = { path = "../ferrite-kernel" }
ferrite-exec = { path = "../ferrite-exec" }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
pprof = { version = "0.13", features = ["flamegraph"] }
# OpenAI HTTP/SSE serving layer (--serve mode): the driver + axum router
# are engine-agnostic (ServeEngine seam); ferrite-serve wires the CUDA
# GpuEngine behind them.
ferrite-http = { path = "../ferrite-http" }
ferrite-dispatch = { path = "../ferrite-dispatch" }
# The DeepSeek-V4.1-Flash serve assembly (`--model dsv41`): config + the TP
# rank pool + the shared ferrite-http stack. Re-exported through this crate's
# `serve` module so the unified binary and `dsv41-run` build one stack.
ferrite-dsv41 = { path = "../ferrite-dsv41" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
axum = "0.7"
